<HTML>
    <HEAD>
        <TITLE>填写留言</TITLE>
    </HEAD>
    <BODY>
        <P align="center">
            <FONT SIZE="7" COLOR="#0000CC" face="黑体">留言簿</FONT>
        </P>
        <FORM METHOD="POST" ACTION="">
            <TABLE align="center">
                <TR>
                    <TD>昵称</TD>
                    <TD><INPUT TYPE="text" NAME="author"></TD>
                </TR>
                <TR>
                    <TD>EMail</TD>
                    <TD><INPUT TYPE="text" NAME="email"></TD>
                </TR>
                <TR>
                    <TD>留言:</TD>
                    <TD><TEXTAREA NAME="msg" ROWS="4" COLS="36"></TEXTAREA></TD>
                </TR>
            </TABLE>
            <CENTER>
                <INPUT TYPE="submit">&nbsp;&nbsp;<INPUT TYPE="reset">
            </CENTER>
        </FORM>
    </BODY>
</HTML>
